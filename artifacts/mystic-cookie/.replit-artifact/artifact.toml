kind = "web"
previewPath = "/"
title = "Mystic Cookie"
version = "1.0.0"
id = "artifacts/mystic-cookie"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20858

[services.development]
run = "pnpm --filter @workspace/mystic-cookie run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mystic-cookie", "run", "build" ]
publicDir = "artifacts/mystic-cookie/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20858"
BASE_PATH = "/"
