name: Mystic Cookie ops (keep-alive, alerts, revenue)
on:
  schedule:
    - cron: '*/15 * * * *'   # keep-alive ping
    - cron: '45 8 * * *'     # daily revenue email
  workflow_dispatch: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Mystic Cookie and alert on failure
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.ADMIN_EMAIL }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 25 https://mystic-cookie.onrender.com/api/health || echo DOWN)
          echo "mystic-cookie -> $code"
          export CODE_VAR="$code"
          if [ "$code" != "200" ]; then
            echo "Mystic Cookie DOWN ($code)"
            if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ] && [ -n "$REPORT_TO" ]; then
              node -e "
                const nm=require('nodemailer');
                const t=nodemailer.createTransport({host:'smtp.gmail.com',port:587,secure:false,auth:{user:process.env.SMTP_USER,pass:process.env.SMTP_PASS}});
                t.sendMail({from:process.env.SMTP_USER,to:process.env.REPORT_TO,subject:'DOWN: Mystic Cookie',text:'Mystic Cookie health check returned '+process.env.CODE_VAR}).then(()=>console.log('alert sent')).catch(e=>{console.error(e.message);process.exit(1)});
              "
            fi
            exit 1
          fi

  revenue-report:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '45 8 * * *' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: npm ci --omit=dev 2>/dev/null || npm install --omit=dev --no-audit --no-fund
      - name: Send daily revenue report
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.ADMIN_EMAIL }}
        run: node scripts/revenue-report.js
