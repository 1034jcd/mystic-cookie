name: Mystic Cookie ops (keep-alive, alerts, revenue, recovery, audit)
on:
  schedule:
    - cron: '*/10 * * * *'   # keep-alive ping (all apps)
    - cron: '45 8 * * *'     # daily revenue email
    - cron: '30 13 * * *'    # daily abandoned-checkout recovery
    - cron: '0 9 * * 1'      # weekly dependency security audit
  workflow_dispatch: {}

jobs:
  ai-marketing:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '45 8 * * *' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          mkdir -p /tmp/mkt-deps
          npm install --no-save --no-audit --no-fund nodemailer
      - name: Social listening + daily hooks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: node scripts/social-listen.cjs

  security-scan:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '0 9 * * 1' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          mkdir -p /tmp/sec-deps
          npm install --no-save --no-audit --no-fund nodemailer
      - name: Scan for leaked secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: node scripts/security-scan.cjs || true

  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: |
          mkdir -p /tmp/revenue-deps
          npm install --no-save --no-audit --no-fund nodemailer
      - name: Ping all BrainAdvisor apps and alert on failure
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.ADMIN_EMAIL }}
        run: |
          urls="https://mystic-cookie.onrender.com/api/healthz https://brainadvisor.onrender.com https://brainapi-1bcu.onrender.com https://brainb2b.onrender.com https://braindocs-7qqx.onrender.com/api/healthz"
          down=""
          for u in $urls; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 45 "$u" || echo DOWN)
            if [ "$code" != "200" ]; then
              echo "$u cold-start retry..."
              sleep 4
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 45 "$u" || echo DOWN)
            fi
            echo "$u -> $code"
            [ "$code" != "200" ] && down="$down $u($code)"
          done
          if [ -n "$down" ]; then
            echo "DOWN APPS:$down"
            export DOWN_VAR="$down"
            if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ] && [ -n "$REPORT_TO" ]; then
              node -e "
                const nm=require('nodemailer');
                const t=nm.createTransport({host:'smtp.gmail.com',port:587,secure:false,auth:{user:process.env.SMTP_USER,pass:process.env.SMTP_PASS}});
                t.sendMail({from:process.env.SMTP_USER,to:process.env.REPORT_TO,subject:'DOWN ALERT: BrainAdvisor apps',text:'Health check failed for:'+process.env.DOWN_VAR}).then(()=>console.log('alert sent')).catch(e=>console.error('alert email failed',e.message));
              "
            fi
            exit 1
          fi

  revenue-report:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '45 8 * * *' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          mkdir -p /tmp/revenue-deps
          npm install --no-save --no-audit --no-fund nodemailer
      - name: Send daily revenue report
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.ADMIN_EMAIL }}
        run: node scripts/revenue-report.cjs

  abandoned-recovery:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '30 13 * * *' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          mkdir -p /tmp/revenue-deps
          npm install --no-save --no-audit --no-fund nodemailer
      - name: Send abandoned-checkout reminders
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          EXCLUDE_EMAILS: ${{ secrets.ADMIN_EMAIL }}
        run: node scripts/abandoned-recovery.cjs

  weekly-audit:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '0 9 * * 1' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install deps
        run: |
          mkdir -p /tmp/revenue-deps
          npm install --no-save --no-audit --no-fund nodemailer
      - name: Audit dependencies
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.ADMIN_EMAIL }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --silent || true
          pnpm audit --json > /tmp/audit.json 2>/dev/null || true
          node scripts/deps-audit.cjs
